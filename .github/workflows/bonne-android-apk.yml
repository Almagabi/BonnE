name: BonnE Android APK
on:
  push:
    branches: [bonne-screen-agent-android]
    paths: ['android-screen-agent/**', '.github/workflows/bonne-android-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-screen-agent
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BonnE-Screen-Agent-APK
          path: android-screen-agent/app/build/outputs/apk/debug/app-debug.apk
