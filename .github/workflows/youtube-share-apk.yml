name: Build YouTube Share Android APK
on:
  push:
    branches: [youtube-share-research-android-20261117]
    paths:
      - 'youtube_share/**'
      - '.github/workflows/youtube-share-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p youtube_share --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-to-ChatGPT-Research-APK
          path: youtube_share/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
