name: BonnE Android Emulator Tests
on:
  workflow_dispatch:
  push:
    branches: [bonne-screen-agent-android]
    paths:
      - 'android-screen-agent/**'
      - 'test-emulator.py'
      - 'test-emulator.sh'
      - '.github/workflows/bonne-emulator-test.yml'
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::No /dev/kvm: emulator would be prohibitively slow"
          fi
      - name: Android emulator functional test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash test-emulator.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonne-emulator-diagnostics
          path: android-screen-agent/emulator-results/
