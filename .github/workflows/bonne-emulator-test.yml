name: BonnE Android Emulator Tests
on:
  workflow_dispatch:
  push:
    branches: [bonne-screen-agent-android]
    paths:
      - 'android-screen-agent/**'
      - '.github/workflows/bonne-emulator-test.yml'
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android emulator functional test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            cd android-screen-agent
            gradle --no-daemon assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant ai.bonne.screenagent android.permission.POST_NOTIFICATIONS
            adb shell settings put secure enabled_accessibility_services ai.bonne.screenagent/.ReplayService
            adb shell settings put secure accessibility_enabled 1
            sleep 3
            adb shell am start -n ai.bonne.screenagent/.MainActivity
            sleep 3
            python3 ../test-emulator.py
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonne-emulator-diagnostics
          path: android-screen-agent/emulator-results/
